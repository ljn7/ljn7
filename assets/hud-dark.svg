<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" role="img" aria-label="HUD: Hearts, Magic, Rupees">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2456" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1230" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88ff44"/>
      <stop offset="100%" stop-color="#44aa22"/>
    </linearGradient>
    <filter id="heartGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="66" rx="6" fill="url(#hudBg)" stroke="#f5d76e" stroke-width="2"/>

  <!-- HEARTS section -->
  <text x="80" y="20" font-family="'Cinzel', Georgia, serif" font-size="10" fill="#c9b87a" text-anchor="middle" letter-spacing="2">HEARTS</text>
  <g transform="translate(20, 30)" filter="url(#heartGlow)">
    <g fill="#ff4444" font-family="Georgia, serif" font-size="22">
      <text x="0" y="20">♥</text>
      <text x="18" y="20">♥</text>
      <text x="36" y="20">♥</text>
      <text x="54" y="20">♥</text>
      <text x="72" y="20">♥</text>
      <text x="90" y="20">♥</text>
      <text x="108" y="20">♥</text>
      <text x="126" y="20">♥</text>
    </g>
  </g>

  <!-- MAGIC section -->
  <text x="280" y="20" font-family="'Cinzel', Georgia, serif" font-size="10" fill="#c9b87a" text-anchor="middle" letter-spacing="2">MAGIC</text>
  <rect x="220" y="35" width="120" height="12" rx="1" fill="#1a1a1a" stroke="#888" stroke-width="1"/>
  <rect x="222" y="37" width="90" height="8" fill="url(#magicGrad)"/>

  <!-- ROLE / TITLE section (center) -->
  <text x="450" y="44" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#f5d76e" text-anchor="middle" letter-spacing="3">JOHN NIRMAL</text>
  <text x="450" y="20" font-family="'Cinzel', Georgia, serif" font-size="9" fill="#c9b87a" text-anchor="middle" letter-spacing="2">SOFTWARE ENGINEER @ CDPG, IISC</text>

  <!-- LOCATION section -->
  <text x="660" y="20" font-family="'Cinzel', Georgia, serif" font-size="10" fill="#c9b87a" text-anchor="middle" letter-spacing="2">REALM</text>
  <text x="660" y="44" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="500" fill="#88ddff" text-anchor="middle">Bengaluru</text>

  <!-- RUPEES section -->
  <text x="820" y="20" font-family="'Cinzel', Georgia, serif" font-size="10" fill="#c9b87a" text-anchor="middle" letter-spacing="2">RUPEES</text>
  <g transform="translate(770, 28)">
    <polygon points="10,0 18,10 10,20 2,10" fill="#f5d76e" stroke="#8b5a14" stroke-width="0.8"/>
    <text x="30" y="16" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#f5d76e">9999</text>
  </g>
</svg>
